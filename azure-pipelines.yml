# Azure DevOps pipeline for Umbraco.Mcp.Cloud.HostedAuth
#
# Builds, packs, and publishes the package to the PUBLIC Umbraco pre-releases
# MyGet feed: https://www.myget.org/F/umbracoprereleases
#
# Auth: uses the ADO NuGet service connection "NuGet MyGet Prereleases Feed"
# (it holds the feed URL + push API key) — no secret variables to manage.
#
# Runs on a Windows agent: the push uses NuGetCommand@2 (nuget.exe), which needs
# Mono on Linux — and ubuntu-latest (24.04) no longer ships Mono. Windows runs
# nuget.exe natively.
#
# Versioning: the package version comes from Directory.Build.props. Bump it there
# for a new release; the push fails if that version already exists on the feed.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - Directory.Build.props
      - azure-pipelines.yml

pr: none

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  project: src/Umbraco.Mcp.Cloud.HostedAuth/Umbraco.Mcp.Cloud.HostedAuth.csproj

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore "$(project)"
    displayName: Restore

  - script: dotnet build "$(project)" --configuration $(buildConfiguration) --no-restore
    displayName: Build

  - script: dotnet pack "$(project)" --configuration $(buildConfiguration) --no-build --output "$(Build.ArtifactStagingDirectory)"
    displayName: Pack

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: nupkg
    displayName: Publish build artifact

  - task: NuGetToolInstaller@1
    displayName: Install NuGet

  - task: NuGetCommand@2
    displayName: Push to umbracoprereleases
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      command: push
      packagesToPush: $(Build.ArtifactStagingDirectory)/*.nupkg
      nuGetFeedType: external
      publishFeedCredentials: NuGet MyGet Prereleases Feed
